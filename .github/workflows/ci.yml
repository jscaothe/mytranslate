# Checks every push and pull request, and builds the Windows installers (not code-signed: there is no signing
# certificate yet). On staging, and in pull requests into it, the installer is "MyTranslate Staging"
# (src-tauri/tauri.staging.conf.json), which installs beside the stable app.
# Update packages are signed with the updater key, a secret only this repository has: pull requests from forks
# build without it, so they get installers to try but no update packages.
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # Tauri's build script checks that the frontend output folder exists.
      - run: New-Item -ItemType Directory -Force ../dist
        shell: pwsh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: [frontend, rust]
    runs-on: windows-latest
    env:
      STAGING: ${{ github.ref == 'refs/heads/staging' || github.base_ref == 'staging' }}
      SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The staging version counts the commits (see app/scripts/release.mjs).
          fetch-depth: ${{ env.STAGING == 'true' && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      # Signs the update packages with the repository secret holding the updater private key.
      - if: env.STAGING != 'true' && env.SIGNED == 'true'
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MYTRANSLATE_UPDATE_URL: ${{ vars.MYTRANSLATE_UPDATE_URL }}
      # Without the key (a pull request from a fork): the same installers, without update packages.
      - if: env.SIGNED != 'true'
        run: npx tauri build --config src-tauri/tauri.unsigned.conf.json
      # The staging app, with its staging version and update address, exactly as a staging release builds it.
      - if: env.STAGING == 'true' && env.SIGNED == 'true'
        run: node scripts/release.mjs --channel staging
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGING == 'true' && 'installers-staging' || 'installers' }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
            app/src-tauri/target/release/bundle/msi/*.msi
